name: 🚀 Build ExamPro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: 📦 Flutter pub get
        run: flutter pub get

      - name: 🖼️ Generate App Icons
        run: |
          python3 - << 'PYEOF'
          import struct, zlib, os

          def create_png(size, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              raw = b''
              for y in range(size):
                  raw += b'\x00'
                  for x in range(size):
                      raw += bytes([r, g, b])
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', ihdr)
              png += chunk(b'IDAT', zlib.compress(raw))
              png += chunk(b'IEND', b'')
              return png

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          base = 'android/app/src/main/res'
          for folder, size in sizes.items():
              path = f'{base}/{folder}'
              os.makedirs(path, exist_ok=True)
              data = create_png(size, 37, 99, 235)
              open(f'{path}/ic_launcher.png', 'wb').write(data)
              open(f'{path}/ic_launcher_round.png', 'wb').write(data)
              print(f'Created {folder} ({size}px)')
          print('All icons generated!')
          PYEOF

      - name: 🔨 Build APK Release
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --suppress-analytics

      - name: 📊 Show APK Size
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "✅ Build BERHASIL!"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamPro-APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
